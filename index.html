<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kota Delivery App</title>
<script>
(function(){
  var KEY='kota_theme';
  function current(){ return document.documentElement.getAttribute('data-theme')||'light'; }
  function setIcon(){ var t=current(); document.querySelectorAll('[data-theme-icon]').forEach(function(el){ el.textContent=t==='dark'?'☀️':'🌙'; }); }
  function apply(theme){ document.documentElement.setAttribute('data-theme', theme); try{ localStorage.setItem(KEY, theme);}catch(e){} setIcon(); }
  var saved=null; try{ saved=localStorage.getItem(KEY);}catch(e){}
  var prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  apply(saved||(prefersDark?'dark':'light'));
  window.toggleTheme=function(){ apply(current()==='dark'?'light':'dark'); };
  document.addEventListener('DOMContentLoaded', setIcon);
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{
  --bg:#f3f5f7; --card:#fff; --text:#121212; --muted:#6b7280; --line:#e8ecf0;
  --brand:#ff4d00; --brand-soft:rgba(255,77,0,.1); --green:#0bbf5a;
  --shadow:0 4px 20px rgba(15,23,42,.06); --radius:18px;
  --header:#fff; --input:#fff;
}
[data-theme="dark"]{
  --bg:#0c0d10; --card:#16181d; --text:#f4f4f5; --muted:#9ca3af; --line:#2a2e36;
  --brand:#ff5c1a; --brand-soft:rgba(255,92,26,.15); --green:#22c55e;
  --shadow:0 4px 24px rgba(0,0,0,.4); --radius:18px;
  --header:rgba(12,13,16,.92); --input:#1c1f26;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.4;padding-bottom:96px;-webkit-font-smoothing:antialiased}
.topbar{position:sticky;top:0;z-index:40;background:var(--header);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--brand),#ff8a4c);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;overflow:hidden;flex-shrink:0}
.logo img{width:100%;height:100%;object-fit:cover}
.topbar h1{font-size:1.05rem;font-weight:800;letter-spacing:-.02em}
.topbar p{font-size:.72rem;color:var(--muted)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:1rem}
.top-actions a{font-size:.8rem;font-weight:700;color:var(--brand);text-decoration:none}
/* Fulfillment toggle */
.fulfill{padding:12px 16px 0}
.fulfill-inner{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.fulfill-inner button{flex:1;border:none;background:transparent;padding:10px;border-radius:11px;font-family:inherit;font-weight:700;font-size:.88rem;color:var(--muted);cursor:pointer}
.fulfill-inner button.on{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(255,77,0,.25)}
.hero{padding:14px 16px 6px}
.hero-img{width:100%;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;background:#1a1a1a;position:relative}
.hero-img img{width:100%;height:100%;object-fit:cover}
.hero-img .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;font-size:.85rem}
.section{padding:16px 16px 4px}
.section-title{font-size:1.15rem;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
/* Compact 2-col grid like Uber/KFC */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;min-height:140px;position:relative;box-shadow:var(--shadow)}
.card-top{display:flex;gap:8px;flex:1}
.card-info{flex:1;min-width:0}
.card-info h3{font-size:.88rem;font-weight:700;line-height:1.25;margin-bottom:4px}
.price{font-size:.9rem;font-weight:800;color:var(--brand);margin-bottom:4px}
.detail{font-size:.72rem;color:var(--muted);line-height:1.35;display:none}
.detail.open{display:block;margin-top:4px}
.more{border:none;background:none;color:var(--brand);font-size:.7rem;font-weight:700;padding:0;cursor:pointer;font-family:inherit;margin-top:4px}
.thumb{width:64px;height:64px;border-radius:14px;background:var(--bg);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:.65rem;color:var(--muted);text-align:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb{position:relative}
.thumb-ph{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:1.1rem;background:var(--bg)}
.add-btn{position:absolute;right:10px;bottom:10px;width:32px;height:32px;border-radius:50%;border:none;background:var(--brand);color:#fff;font-size:1.2rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 4px 12px rgba(255,77,0,.3)}
.qty-ctrl{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px}
.qty-ctrl button{width:28px;height:28px;border-radius:50%;border:none;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}
.qty-ctrl span{font-weight:800;min-width:16px;text-align:center;font-size:.85rem}
/* Cart bar */
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;box-shadow:0 -8px 30px rgba(0,0,0,.08);z-index:50}
.cart-bar .info{font-size:.78rem;color:var(--muted)}
.cart-bar strong{display:block;font-size:1.1rem;color:var(--text);font-weight:800}
.cart-bar button{background:var(--brand);color:#fff;border:none;padding:14px 22px;border-radius:28px;font-weight:800;font-size:.9rem;cursor:pointer;font-family:inherit}
.cart-bar button:disabled{background:#ccc;color:#666}
/* Modal */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px 28px;max-height:92vh;overflow-y:auto;position:relative}
.sheet h2{font-size:1.2rem;font-weight:800;margin-bottom:12px}
.close-x{position:absolute;right:14px;top:14px;border:none;background:var(--bg);width:34px;height:34px;border-radius:50%;font-size:1.1rem;cursor:pointer;color:var(--text)}
.fg{margin-bottom:11px}
.fg label{display:block;font-size:.72rem;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.fg input,.fg textarea,.fg select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font-family:inherit;font-size:.95rem;background:var(--input);color:var(--text)}
.summary{background:var(--bg);border-radius:14px;padding:12px;margin-bottom:12px}
.summary .row{display:flex;justify-content:space-between;padding:5px 0;font-size:.9rem}
.summary .grand{font-weight:800;font-size:1.05rem;color:var(--brand);margin-top:6px}
.pay-opts,.mode-opts{display:flex;gap:8px;margin-bottom:12px}
.pay-opts label,.mode-opts label{flex:1;padding:12px;border:2px solid var(--line);border-radius:12px;text-align:center;font-size:.82rem;font-weight:700;cursor:pointer}
.pay-opts label.on,.mode-opts label.on{border-color:var(--brand);background:var(--brand-soft)}
.pay-opts input,.mode-opts input{display:none}
.btn-main{width:100%;padding:15px;border:none;border-radius:14px;background:var(--brand);color:#fff;font-weight:800;font-size:1rem;font-family:inherit;cursor:pointer}
.note{font-size:.75rem;color:var(--muted);text-align:center;margin-top:10px}
.fee-note{font-size:.78rem;color:var(--muted);margin:-4px 0 10px;text-align:center}
@media(max-width:360px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo" id="logo-box">
    <img src="" alt="" id="logo-img" style="display:none" onerror="this.style.display='none'">
    <span id="logo-letter">K</span>
  </div>
  <div>
    <h1>Kota Delivery App</h1>
    <p>Fresh · Hot · Fast</p>
  </div>
  <div class="top-actions">
    <button type="button" class="icon-btn" onclick="toggleTheme()"><span data-theme-icon>🌙</span></button>
    <a href="track.html">Track</a>
  </div>
</header>

<div class="fulfill">
  <div class="fulfill-inner">
    <button type="button" class="on" id="mode-delivery" onclick="setMode('delivery')">Delivery</button>
    <button type="button" id="mode-pickup" onclick="setMode('pickup')">Pickup</button>
  </div>
  <p class="fee-note" id="mode-note">Delivered to your door</p>
</div>

<section class="hero">
  <div class="hero-img">
    <img src="hero.jpg" alt="Kota" id="hero-img" onerror="this.onerror=null;this.style.display='none';var ph=document.getElementById('hero-ph');if(ph)ph.style.display='flex';">
    <div class="ph" id="hero-ph" style="display:none">Your kota, made fresh</div>
  </div>
</section>

<div id="menu-root"></div>

<div class="cart-bar">
  <div class="info"><span id="cart-count">0 items</span><strong id="cart-total">R0</strong></div>
  <button type="button" id="open-cart" disabled>View cart</button>
</div>

<div class="modal" id="cart-modal">
  <div class="sheet">
    <button type="button" class="close-x" id="close-modal">×</button>
    <h2>Your order</h2>
    <div class="summary" id="cart-summary"></div>
    <div class="mode-opts">
      <label class="on" id="lbl-del"><input type="radio" name="fulfill" value="delivery" checked> Delivery</label>
      <label id="lbl-pick"><input type="radio" name="fulfill" value="pickup"> Pickup</label>
    </div>
    <form id="order-form" onsubmit="return false;">
      <div class="fg"><label>Name *</label><input id="cust-name" required placeholder="Your name"></div>
      <div class="fg"><label>Phone *</label><input id="cust-phone" type="tel" required placeholder="082 123 4567"></div>
      <div class="fg" id="address-fg"><label>Address *</label><input id="cust-address" placeholder="Street, suburb"></div>
      <div class="fg"><label>Notes</label><textarea id="cust-notes" rows="2" placeholder="Extra sauce, gate code…"></textarea></div>
      <div class="fg"><label>Payment</label>
        <div class="pay-opts">
          <label class="on" id="lbl-cash"><input type="radio" name="pay" value="cash" checked> Cash</label>
          <label id="lbl-online"><input type="radio" name="pay" value="online"> Pay online</label>
        </div>
      </div>
      <label style="display:flex;gap:8px;align-items:flex-start;font-size:.8rem;margin-bottom:12px;cursor:pointer">
        <input type="checkbox" id="confirm-wa-check" style="margin-top:3px;accent-color:var(--brand)">
        <span>I will send the WhatsApp message so kitchen can confirm my order.</span>
      </label>
      <button type="submit" class="btn-main" id="send-order">Submit order</button>
      <p class="note">Next: confirm on WhatsApp with your order code.</p>
    </form>
  </div>
</div>

<div class="modal" id="wa-confirm-modal">
  <div class="sheet">
    <h2>Confirm on WhatsApp</h2>
    <p style="font-size:.9rem;color:var(--muted);margin-bottom:12px">Send the message so kitchen can accept your order.</p>
    <div class="summary" id="wa-confirm-summary"></div>
    <div style="text-align:center;margin:12px 0;padding:12px;background:var(--bg);border-radius:12px">
      <div style="font-size:.72rem;color:var(--muted);font-weight:700">CONFIRM CODE</div>
      <div id="wa-confirm-code" style="font-size:1.7rem;font-weight:800;color:var(--brand)">—</div>
      <div id="wa-confirm-timer" style="margin-top:8px;font-weight:700;color:var(--muted)">—</div>
    </div>
    <button type="button" class="btn-main" style="background:#25D366" id="wa-confirm-btn" onclick="openWaConfirmMessage()">Confirm on WhatsApp</button>
    <button type="button" class="btn-main" style="background:var(--bg);color:var(--text);margin-top:8px;border:1px solid var(--line)" onclick="closeWaConfirm()">Close</button>
  </div>
</div>

<script>
/*__KOTA_PUBLISH__*/
window.KOTA_PUBLISHED_MENU = null;
window.KOTA_PUBLISHED_BRANDING = null;
/*__KOTA_PUBLISH_END__*/

const WA_NUMBER = "27631694359";
const SHEETS = "https://script.google.com/macros/s/AKfycbxg71IdS6OulHZdeYds79butV1ku-E1I2YSBkkb3R8vU3eim03nYq3QrK1TNdAtqiaWAQ/exec";
const PAYFAST_ENABLED = false;

const DEFAULT_MENU = [
  { id:"k1", name:"Basic Kota", price:15, image:"menu-images/basic.jpg", cat:"Kota", detail:"Chips, atchar, French" },
  { id:"k2", name:"Classic Kota", price:18, image:"menu-images/classic.jpg", cat:"Kota", detail:"Chips, atchar, French, egg or cheese" },
  { id:"k3", name:"Cheese & Egg Kota", price:22, image:"menu-images/cheese-egg.jpg", cat:"Kota", detail:"Chips, atchar, French, cheese, egg" },
  { id:"k4", name:"Vienna Kota", price:28, image:"menu-images/vienna.jpg", cat:"Kota", detail:"Chips, atchar, French, Vienna, cheese, egg" },
  { id:"k5", name:"Fish Kota", price:42, image:"menu-images/fish.jpg", cat:"Kota", detail:"Chips, atchar, French, Vienna, cheese, egg, fish" },
  { id:"k6", name:"Russian Fish Kota", price:50, image:"menu-images/russian-fish.jpg", cat:"Kota", detail:"Chips, atchar, French, cheese, egg, Vienna, Russian, fish" },
  { id:"k7", name:"Full House Kota", price:65, image:"menu-images/fullhouse.jpg", cat:"Kota", detail:"Chips, atchar, French, cheese, Vienna, Russian, burger, fish" },
  { id:"a_french", name:"French", price:5, image:"menu-images/french.jpg", cat:"Add-ons", detail:"Extra French" },
  { id:"a_patty", name:"Burger Patty", price:15, image:"menu-images/patty.jpg", cat:"Add-ons", detail:"" },
  { id:"a_pork", name:"Pork Burger", price:25, image:"menu-images/pork.jpg", cat:"Add-ons", detail:"" },
  { id:"a_fish", name:"Fish", price:15, image:"menu-images/fish-add.jpg", cat:"Add-ons", detail:"" },
  { id:"a_egg", name:"Egg", price:7, image:"menu-images/egg.jpg", cat:"Add-ons", detail:"" },
  { id:"a_cheese", name:"Cheese", price:7, image:"menu-images/cheese.jpg", cat:"Add-ons", detail:"" },
  { id:"a_vienna", name:"Vienna", price:13, image:"menu-images/vienna-add.jpg", cat:"Add-ons", detail:"" },
  { id:"a_rus_big", name:"Russian Big", price:20, image:"menu-images/russian-big.jpg", cat:"Add-ons", detail:"" },
  { id:"a_rus_sm", name:"Russian Small", price:15, image:"menu-images/russian-small.jpg", cat:"Add-ons", detail:"" },
  { id:"alt_wors", name:"Wors Rolls + Chips", price:40, image:"menu-images/wors.jpg", cat:"Meals", detail:"Wors roll with chips" },
  { id:"alt_beef", name:"Beef Burger + Chips", price:50, image:"menu-images/beef.jpg", cat:"Meals", detail:"" },
  { id:"alt_mash", name:"Kota Mash an Maotwana", price:23, image:"menu-images/mash.jpg", cat:"Meals", detail:"" },
  { id:"chips_s", name:"Chips Small", price:20, image:"menu-images/chips-s.jpg", cat:"Chips", detail:"" },
  { id:"chips_m", name:"Chips Medium", price:35, image:"menu-images/chips-m.jpg", cat:"Chips", detail:"" },
  { id:"chips_l", name:"Chips Larger", price:50, image:"menu-images/chips-l.jpg", cat:"Chips", detail:"" }
];

const MENU = (window.KOTA_PUBLISHED_MENU && window.KOTA_PUBLISHED_MENU.length)
  ? window.KOTA_PUBLISHED_MENU
  : DEFAULT_MENU;

const BRANDING = window.KOTA_PUBLISHED_BRANDING || { logo: "", hero: "hero.jpg" };
if (!BRANDING.hero) BRANDING.hero = "hero.jpg";


function appBasePath(){
  // Supports GitHub Pages project sites: /repo-name/
  try{
    const path = location.pathname || "/";
    if (path.endsWith(".html")) {
      const dir = path.substring(0, path.lastIndexOf("/") + 1);
      return dir || "/";
    }
    return path.endsWith("/") ? path : (path + "/");
  }catch(e){ return "/"; }
}
function resolveAsset(src){
  if(!src) return "";
  if(/^https?:\/\//i.test(src) || src.startsWith("data:") || src.startsWith("blob:")) return src;
  if(src.startsWith("/")) return src;
  return appBasePath() + src.replace(/^\.\//, "");
}
function safeImgTag(src, alt, cls){
  const primary = resolveAsset(src);
  const fallbacks = [resolveAsset("kota.jpg"), resolveAsset("hero.jpg")].filter(Boolean);
  const all = [primary].concat(fallbacks).filter((v,i,a)=>v && a.indexOf(v)===i);
  const chain = all.map(u => u.replace(/'/g, "%27"));
  // onerror walks fallback list without throwing console loops
  return `<img class="${cls||""}" alt="${(alt||"").replace(/"/g,"&quot;")}" loading="lazy" decoding="async" data-fallbacks='${JSON.stringify(chain).replace(/'/g,"&#39;")}' src="${chain[0]||""}" onerror="window.__imgFallback&&window.__imgFallback(this)">`;
}
window.__imgFallback = function(img){
  try{
    if(!img || img.dataset.failed === "1") return;
    let list = [];
    try { list = JSON.parse((img.getAttribute("data-fallbacks")||"[]").replace(/&#39;/g,"'")); } catch(e){}
    let i = parseInt(img.dataset.fbIndex || "0", 10) + 1;
    while(i < list.length && list[i] === img.src) i++;
    if(i < list.length){
      img.dataset.fbIndex = String(i);
      img.src = list[i];
      return;
    }
    img.dataset.failed = "1";
    img.style.display = "none";
    const ph = img.nextElementSibling;
    if(ph && ph.classList && ph.classList.contains("chip-ph")) ph.style.display = "inline-flex";
    if(ph && ph.classList && ph.classList.contains("thumb-ph")) ph.style.display = "flex";
  }catch(e){}
};

let cart = {};
let fulfillMode = "delivery"; // delivery | pickup

function setMode(mode) {
  fulfillMode = mode;
  document.getElementById("mode-delivery").classList.toggle("on", mode === "delivery");
  document.getElementById("mode-pickup").classList.toggle("on", mode === "pickup");
  document.getElementById("mode-note").textContent = mode === "delivery" ? "Delivered to your door" : "Collect from the shop — no delivery fee";
  document.getElementById("lbl-del").classList.toggle("on", mode === "delivery");
  document.getElementById("lbl-pick").classList.toggle("on", mode === "pickup");
  document.querySelector('input[name="fulfill"][value="delivery"]').checked = mode === "delivery";
  document.querySelector('input[name="fulfill"][value="pickup"]').checked = mode === "pickup";
  const addr = document.getElementById("address-fg");
  addr.style.display = mode === "pickup" ? "none" : "block";
  document.getElementById("cust-address").required = mode === "delivery";
}

function applyBranding() {
  if (BRANDING.brandColor) document.documentElement.style.setProperty("--brand", BRANDING.brandColor);
  if (BRANDING.greenColor) document.documentElement.style.setProperty("--green", BRANDING.greenColor);
  if (BRANDING.logo) {
    const img = document.getElementById("logo-img");
    img.src = BRANDING.logo; img.style.display = "block";
    document.getElementById("logo-letter").style.display = "none";
  }
  if (BRANDING.hero) {
    const img = document.getElementById("hero-img");
    img.src = BRANDING.hero; img.style.display = "block";
    document.getElementById("hero-ph").style.display = "none";
  }
}

function toggleDetail(id) {
  const el = document.getElementById("det-" + id);
  const btn = document.getElementById("more-" + id);
  if (!el) return;
  const open = el.classList.toggle("open");
  if (btn) btn.textContent = open ? "Hide details" : "Details";
}

function renderMenu() {
  const cats = [];
  MENU.forEach(item => { const c = item.cat || "Menu"; if (!cats.includes(c)) cats.push(c); });
  let html = "";
  cats.forEach(cat => {
    html += `<div class="section"><div class="section-title">${cat}</div></div><div class="grid">`;
    MENU.filter(i => (i.cat || "Menu") === cat).forEach(item => {
      const qty = cart[item.id] || 0;
      const src = item.image || "kota.jpg";
      const img = safeImgTag(src, item.name, "") + `<span class="thumb-ph" style="display:none">🍽</span>`;
      const detail = item.detail
        ? `<button type="button" class="more" id="more-${item.id}" onclick="toggleDetail('${item.id}')">Details</button>
           <div class="detail" id="det-${item.id}">${item.detail}</div>`
        : "";
      const controls = qty
        ? `<div class="qty-ctrl">
             <button type="button" onclick="changeQty('${item.id}',-1)">−</button>
             <span>${qty}</span>
             <button type="button" onclick="changeQty('${item.id}',1)">+</button>
           </div>`
        : `<button type="button" class="add-btn" onclick="changeQty('${item.id}',1)">+</button>`;
      html += `<div class="card">
        <div class="card-top">
          <div class="card-info">
            <h3>${item.name}</h3>
            <div class="price">R${item.price}</div>
            ${detail}
          </div>
          <div class="thumb">${img}</div>
        </div>
        ${controls}
      </div>`;
    });
    html += `</div>`;
  });
  document.getElementById("menu-root").innerHTML = html;
  updateBar();
}

function changeQty(id, d) {
  cart[id] = (cart[id] || 0) + d;
  if (cart[id] <= 0) delete cart[id];
  renderMenu();
}

function updateBar() {
  let total = 0, count = 0;
  for (const id in cart) {
    const item = MENU.find(m => m.id === id);
    if (item) { total += item.price * cart[id]; count += cart[id]; }
  }
  document.getElementById("cart-total").textContent = "R" + total;
  document.getElementById("cart-count").textContent = count + (count === 1 ? " item" : " items");
  const btn = document.getElementById("open-cart");
  btn.disabled = count === 0;
  btn.textContent = count ? `View cart · R${total}` : "View cart";
}

document.getElementById("open-cart").onclick = () => {
  let total = 0, html = "";
  for (const id in cart) {
    const item = MENU.find(m => m.id === id);
    if (!item) continue;
    const sub = item.price * cart[id];
    total += sub;
    html += `<div class="row"><span>${cart[id]}× ${item.name}</span><span>R${sub}</span></div>`;
  }
  html += `<div class="row"><span>Type</span><span>${fulfillMode === "pickup" ? "Pickup" : "Delivery"}</span></div>`;
  html += `<div class="row grand"><span>Total</span><span>R${total}</span></div>`;
  document.getElementById("cart-summary").innerHTML = html;
  setMode(fulfillMode);
  document.getElementById("cart-modal").classList.add("open");
};
document.getElementById("close-modal").onclick = () => document.getElementById("cart-modal").classList.remove("open");

document.getElementById("lbl-del").onclick = () => setMode("delivery");
document.getElementById("lbl-pick").onclick = () => setMode("pickup");
document.getElementById("lbl-cash").onclick = () => {
  document.querySelector('input[value="cash"]').checked = true;
  document.getElementById("lbl-cash").classList.add("on");
  document.getElementById("lbl-online").classList.remove("on");
};
document.getElementById("lbl-online").onclick = () => {
  document.querySelector('input[value="online"]').checked = true;
  document.getElementById("lbl-online").classList.add("on");
  document.getElementById("lbl-cash").classList.remove("on");
};

var CONFIRM_SECONDS = 10 * 60;
var SUBMIT_COOLDOWN_MS = 30 * 1000;
var __confirmTimerId = null;
var __lastSubmitAt = 0;

function formatTimer(sec){
  return Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0");
}
function stopConfirmTimer(){ if(__confirmTimerId){ clearInterval(__confirmTimerId); __confirmTimerId=null; } }
function startConfirmTimer(seconds){
  stopConfirmTimer();
  const el=document.getElementById("wa-confirm-timer");
  let left=seconds;
  const tick=()=>{
    if(!el) return;
    if(left<=0){
      stopConfirmTimer();
      el.textContent="Time expired — place a new order";
      el.style.color="#ef4444";
      window.__pendingWaOrder=null;
      const btn=document.getElementById("wa-confirm-btn");
      if(btn){ btn.disabled=true; btn.textContent="Time expired"; }
      return;
    }
    el.textContent="Time to send WhatsApp: "+formatTimer(left);
    el.style.color=left<=60?"#ef4444":"var(--brand)";
    left-=1;
  };
  tick();
  __confirmTimerId=setInterval(tick,1000);
}
function openWaConfirmMessage(){
  const pending=window.__pendingWaOrder;
  if(!pending||!pending.msg){ alert("No order to confirm or timer expired."); return; }
  if(pending.expiresAt&&Date.now()>pending.expiresAt){ alert("Time expired. Place a new order."); return; }
  window.open("https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(pending.msg),"_blank");
  alert("WhatsApp opened.\\nTap Send to confirm.\\nCode: "+pending.code);
}
function closeWaConfirm(){ document.getElementById("wa-confirm-modal").classList.remove("open"); }

const submitOrder = async () => {
  const name=document.getElementById("cust-name").value.trim();
  const phone=document.getElementById("cust-phone").value.trim();
  const address=document.getElementById("cust-address").value.trim();
  const notes=document.getElementById("cust-notes").value.trim();
  const pay=document.querySelector('input[name="pay"]:checked')?.value||"cash";
  const mode=fulfillMode;

  if(__lastSubmitAt && Date.now()-__lastSubmitAt < SUBMIT_COOLDOWN_MS){
    alert("Please wait a moment before submitting another order."); return;
  }
  if(!name||name.length<2){ alert("Enter your name."); return; }
  if(!phone||phone.replace(/\\D/g,"").length<10){ alert("Enter a valid phone number."); return; }
  if(mode==="delivery" && address.length<5){ alert("Enter your delivery address."); return; }
  if(!Object.keys(cart).length){ alert("Cart is empty."); return; }
  const waCheck=document.getElementById("confirm-wa-check");
  if(waCheck && !waCheck.checked){ alert("Please tick the WhatsApp confirmation box."); return; }

  let total=0, itemsText="", itemsSheet=[];
  for(const id in cart){
    const item=MENU.find(m=>m.id===id);
    if(!item) continue;
    const sub=item.price*cart[id];
    total+=sub;
    itemsText+=`• ${cart[id]}× ${item.name} — R${sub}\\n`;
    itemsSheet.push(`${cart[id]}× ${item.name}`);
  }

  const confirmCode="K"+String(Math.floor(1000+Math.random()*9000));
  const btn=document.getElementById("send-order");
  btn.disabled=true; btn.textContent="Submitting…";
  const packedNotes=`[PENDING:1][PAY:${pay==="online"?"paid":"cash"}][MODE:${mode}][CODE:${confirmCode}] ${notes}`.trim();
  const addrOut = mode==="pickup" ? (address || "PICKUP") : address;

  try{
    await fetch(SHEETS,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({action:"add",name,phone,address:addrOut,notes:packedNotes,items:itemsSheet.join(", "),total})});
  }catch(e){}

  if(pay==="online" && !PAYFAST_ENABLED){
    alert("Online payment is not set up yet. Choose Cash.");
    btn.disabled=false; btn.textContent="Submit order"; return;
  }

  const msg=`*Kota Delivery Order*\\n\\n`+
    `*Confirm code:* ${confirmCode}\\n`+
    `*Type:* ${mode==="pickup"?"Pickup":"Delivery"}\\n`+
    `*Name:* ${name}\\n*Phone:* ${phone}\\n`+
    (mode==="delivery"?`*Address:* ${address}\\n`:"")+
    (notes?`*Notes:* ${notes}\\n`:"")+
    `*Payment:* ${pay==="online"?"Online":"Cash"}\\n\\n*Items:*\\n${itemsText}\\n*TOTAL: R${total}*\\n\\n_Please send this message to confirm your order._`;

  const expiresAt=Date.now()+CONFIRM_SECONDS*1000;
  window.__pendingWaOrder={msg,code:confirmCode,total,expiresAt,
    itemsHtml:itemsSheet.map(x=>`<div class="row"><span>${x}</span></div>`).join("")+
      `<div class="row"><span>Type</span><span>${mode==="pickup"?"Pickup":"Delivery"}</span></div>`+
      `<div class="row grand"><span>Total</span><span>R${total}</span></div>`};

  document.getElementById("wa-confirm-code").textContent=confirmCode;
  document.getElementById("wa-confirm-summary").innerHTML=window.__pendingWaOrder.itemsHtml;
  document.getElementById("wa-confirm-btn").disabled=false;
  document.getElementById("wa-confirm-btn").textContent="Confirm on WhatsApp";
  document.getElementById("cart-modal").classList.remove("open");
  document.getElementById("wa-confirm-modal").classList.add("open");
  startConfirmTimer(CONFIRM_SECONDS);
  __lastSubmitAt=Date.now();
  cart={}; renderMenu();
  btn.disabled=false; btn.textContent="Submit order";
};

document.getElementById("send-order").onclick=function(e){ e.preventDefault(); submitOrder(); };
document.getElementById("order-form").addEventListener("submit", function(e){ e.preventDefault(); submitOrder(); });

applyBranding();
renderMenu();
setMode("delivery");
</script>

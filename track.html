<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Track order · Kota Delivery App</title>
<script>
(function(){
  var KEY='kota_theme';
  function current(){ return document.documentElement.getAttribute('data-theme')||'light'; }
  function setIcon(){ var t=current(); document.querySelectorAll('[data-theme-icon]').forEach(function(el){ el.textContent=t==='dark'?'☀️':'🌙'; }); }
  function apply(theme){ document.documentElement.setAttribute('data-theme', theme); try{ localStorage.setItem(KEY, theme);}catch(e){} setIcon(); }
  var saved=null; try{ saved=localStorage.getItem(KEY);}catch(e){}
  var prefersDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  apply(saved||(prefersDark?'dark':'light'));
  window.toggleTheme=function(){ apply(current()==='dark'?'light':'dark'); };
  document.addEventListener('DOMContentLoaded', setIcon);
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root,[data-theme="light"]{
  --bg:#f2f4f7;--card:#ffffff;--surface2:#e9edf2;--text:#0f1419;--muted:#667085;--line:#e4e7ec;--border:#e4e7ec;
  --brand:#ff4d00;--brand-soft:rgba(255,77,0,.10);--green:#12b76a;--header-bg:rgba(255,255,255,.92);--input-bg:#fff;
  --shadow:0 4px 24px rgba(16,24,40,.06);--radius:16px;
}
[data-theme="dark"]{
  --bg:#0b0d12;--card:#141821;--surface2:#1b2130;--text:#f5f7fa;--muted:#98a2b3;--line:#2a3344;--border:#2a3344;
  --brand:#ff5c1a;--brand-soft:rgba(255,92,26,.16);--green:#32d583;--header-bg:rgba(11,13,18,.92);--input-bg:#1b2130;
  --shadow:0 8px 28px rgba(0,0,0,.45);--radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh}

.topbar{position:sticky;top:0;z-index:40;background:var(--header-bg);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--brand),#ff8a4c);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex-shrink:0}
.topbar h1{font-size:1.05rem;font-weight:800;letter-spacing:-.02em;flex:1}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:1rem;color:var(--text)}
.topbar a{font-size:.8rem;font-weight:700;color:var(--brand);text-decoration:none}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 48px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:.95rem;font-weight:800;margin-bottom:12px;letter-spacing:-.01em}
input{width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--input-bg);color:var(--text);font-family:inherit;font-size:1rem;margin-bottom:10px}
input:focus{outline:none;border-color:var(--brand)}
.btn{width:100%;padding:14px;border:none;border-radius:28px;background:var(--brand);color:#fff;font-weight:800;font-size:.95rem;font-family:inherit;cursor:pointer}
.btn:disabled{opacity:.55}
.hint{font-size:.75rem;color:var(--muted);text-align:center;margin-top:8px}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{flex:1;padding:10px;border:none;background:transparent;border-radius:11px;font-family:inherit;font-weight:700;font-size:.82rem;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--brand);color:#fff}
.status-hero{text-align:center;padding:8px 0 4px}
.status-hero .emoji{font-size:2.4rem;margin-bottom:8px}
.status-hero h3{font-size:1.25rem;font-weight:800;letter-spacing:-.02em}
.status-hero p{color:var(--muted);font-size:.88rem;margin-top:4px}
.timeline{margin:20px 0 8px;padding-left:8px}
.tl-item{display:flex;gap:12px;padding-bottom:18px;position:relative}
.tl-item:not(:last-child)::before{content:"";position:absolute;left:9px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl-item.done:not(:last-child)::before{background:var(--green)}
.tl-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--card);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.65rem;z-index:1}
.tl-item.done .tl-dot{background:var(--green);border-color:var(--green);color:#fff}
.tl-item.active .tl-dot{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 0 0 4px var(--brand-soft)}
.tl-body{flex:1;padding-top:1px}
.tl-body strong{font-size:.9rem;display:block;font-weight:700}
.tl-body span{font-size:.78rem;color:var(--muted)}
.detail{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.detail:last-child{border:none}
.detail .l{color:var(--muted)}
.detail .v{font-weight:700;text-align:right;max-width:62%}
.badge{font-size:.65rem;font-weight:800;text-transform:uppercase;padding:4px 10px;border-radius:20px;letter-spacing:.03em}
.badge.done{background:var(--surface2);color:var(--muted)}
.empty{text-align:center;padding:28px 12px;color:var(--muted);font-size:.9rem}
.eta{display:inline-block;margin-top:10px;background:var(--brand-soft);color:var(--brand);padding:6px 12px;border-radius:20px;font-size:.8rem;font-weight:700}
.err{background:rgba(239,68,68,.1);color:#ef4444;padding:10px 12px;border-radius:12px;font-size:.85rem;margin-bottom:12px;display:none}
.item-chips{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0}
.item-chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;font-size:.82rem;font-weight:600;color:var(--text)}
@media(min-width:640px){.wrap{padding-top:24px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">K</div>
  <h1>Track order</h1>
  <button type="button" class="icon-btn" onclick="toggleTheme()"><span data-theme-icon>🌙</span></button>
  <a href="index.html">Menu</a>
</header>
<div class="wrap">
  <div class="card">
    <h2>Your phone number</h2>
    <div class="err" id="err"></div>
    <input type="tel" id="phone" placeholder="e.g. 082 123 4567" inputmode="tel">
    <button class="btn" id="btn" type="button">Find my orders</button>
    <p class="hint">Use the same number you used when ordering</p>
  </div>
  <div class="tabs" id="view-tabs" style="display:none">
    <button class="on" data-v="live" type="button">Live</button>
    <button data-v="history" type="button">History</button>
  </div>
  <div id="live-view"></div>
  <div id="history-view" style="display:none"></div>
</div>
<script>
const SHEETS="https://script.google.com/macros/s/AKfycbxg71IdS6OulHZdeYds79butV1ku-E1I2YSBkkb3R8vU3eim03nYq3QrK1TNdAtqiaWAQ/exec";
const STEPS=[
  {key:"pending", title:"Awaiting confirmation", desc:"Send WhatsApp so kitchen can confirm"},
  {key:"new", title:"Order placed", desc:"Kitchen has your order"},
  {key:"cooking", title:"Preparing", desc:"Your food is being made"},
  {key:"ready", title:"Ready", desc:"Waiting for a driver"},
  {key:"out", title:"On the way", desc:"Driver is heading to you"},
  {key:"done", title:"Delivered", desc:"Enjoy your meal"}
];
const STATUS_ALIAS={preparing:"cooking",delivered:"done"};
let allOrders=[], view="live", pollTimer=null;
function digits(p){ return String(p||"").replace(/\D/g,""); }
function norm(p){ let d=digits(p); if(d.startsWith("27")&&d.length>=11)d="0"+d.slice(2); if(d.length===9)d="0"+d; return d; }
function phonesMatch(a,b){ const na=norm(a),nb=norm(b); if(!na||!nb)return false; if(na===nb)return true; return na.slice(-9)===nb.slice(-9); }
function statusKey(s){ s=String(s||"new").toLowerCase(); return STATUS_ALIAS[s]||s; }
function stepIndex(s){ const k=statusKey(s); const i=STEPS.findIndex(x=>x.key===k); return i<0?1:i; }
function setView(v){
  view=v;
  document.querySelectorAll('#view-tabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  document.getElementById('live-view').style.display=v==='live'?'block':'none';
  document.getElementById('history-view').style.display=v==='history'?'block':'none';
}
function etaText(status){
  const k=statusKey(status);
  if(k==='pending') return 'Send the WhatsApp message to confirm';
  if(k==='new') return 'Usually 25–40 min';
  if(k==='cooking') return 'About 15–25 min left';
  if(k==='ready') return 'Driver picking up soon';
  if(k==='out') return 'Arriving soon';
  return 'Completed';
}
function emoji(status){
  const k=statusKey(status);
  return ({pending:'💬',new:'🧾',cooking:'👨‍🍳',ready:'✅',out:'🛵',done:'🎉'})[k]||'🧾';
}
function showErr(msg){
  const el=document.getElementById('err');
  if(!msg){ el.style.display='none'; el.textContent=''; return; }
  el.style.display='block'; el.textContent=msg;
}
function formatItemChips(items){
  if(!items||items==='—') return '<span class="item-chip">—</span>';
  return String(items).split(/,\s*/).filter(Boolean).map(part=>`<span class="item-chip">${part.trim()}</span>`).join('')||'<span class="item-chip">—</span>';
}
function normalizeOrder(o){
  let notes=String(o.notes||"");
  let st=statusKey(o.status);
  if(/\[PENDING:1\]/i.test(notes)&&(st==='new'||st==='pending')) st='pending';
  notes=notes.replace(/\[PENDING:1\]/gi,'').replace(/\[PAY:(cash|paid)\]/gi,'').replace(/\[CODE:[^\]]+\]/gi,'').replace(/\[FEE:\d+\]/gi,'').replace(/\[MODE:(delivery|pickup)\]/gi,'').trim();
  return {id:o.id,name:o.name,phone:o.phone,address:o.address,notes,items:o.items||'—',total:o.total,status:st,timestamp:o.timestamp||o.updated||'',updated:o.updated||o.timestamp||''};
}
function renderLive(){
  const el=document.getElementById('live-view');
  const active=allOrders.filter(o=>!['done','delivered'].includes(o.status));
  if(!active.length){ el.innerHTML=`<div class="card"><div class="empty">No active orders.<br>Check History for past orders.</div></div>`; return; }
  el.innerHTML=active.map(o=>{
    const idx=stepIndex(o.status);
    const st=STEPS[idx]||STEPS[1];
    const tl=STEPS.map((s,i)=>{
      let cls='tl-item';
      if(i<idx) cls+=' done';
      if(i===idx) cls+=' active';
      if(idx===STEPS.length-1) cls='tl-item done';
      return `<div class="${cls}"><div class="tl-dot">${i<idx||idx===STEPS.length-1?'✓':(i+1)}</div>
        <div class="tl-body"><strong>${s.title}</strong><span>${s.desc}</span></div></div>`;
    }).join('');
    return `<div class="card">
      <div class="status-hero">
        <div class="emoji">${emoji(o.status)}</div>
        <h3>${st.title}</h3>
        <p>${st.desc}</p>
        <div class="eta">${etaText(o.status)}</div>
      </div>
      <div class="timeline">${tl}</div>
      <div class="detail"><span class="l">Order</span><span class="v">${o.id||'—'}</span></div>
      <div style="margin:10px 0 4px;font-size:.78rem;color:var(--muted);font-weight:700">Items</div>
      <div class="item-chips">${formatItemChips(o.items)}</div>
      <div class="detail"><span class="l">Total</span><span class="v" style="color:var(--brand);font-weight:800">R${o.total}</span></div>
      <div class="detail"><span class="l">Address</span><span class="v">${o.address||'—'}</span></div>
      ${o.notes?`<div class="detail"><span class="l">Notes</span><span class="v">${o.notes}</span></div>`:''}
      <div class="detail"><span class="l">Updated</span><span class="v">${o.updated||'—'}</span></div>
    </div>`;
  }).join('');
}
function renderHistory(){
  const el=document.getElementById('history-view');
  const hist=allOrders.filter(o=>['done','delivered'].includes(o.status));
  if(!hist.length){ el.innerHTML=`<div class="card"><div class="empty">No past orders yet.</div></div>`; return; }
  el.innerHTML=hist.map(o=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <strong style="font-size:.95rem">${o.timestamp||o.id}</strong>
        <span class="badge done">Delivered</span>
      </div>
      <div style="margin:8px 0 4px;font-size:.78rem;color:var(--muted);font-weight:700">Items</div>
      <div class="item-chips">${formatItemChips(o.items)}</div>
      <div class="detail"><span class="l">Total</span><span class="v" style="color:var(--brand);font-weight:800">R${o.total}</span></div>
      <div class="detail"><span class="l">Address</span><span class="v">${o.address||'—'}</span></div>
    </div>`).join('');
}
async function lookup(silent){
  const raw=document.getElementById('phone').value.trim();
  if(!raw){ if(!silent) showErr('Enter your phone number'); return; }
  showErr('');
  const phone=norm(raw);
  if(digits(phone).length<9){ if(!silent) showErr('Enter a valid phone number'); return; }
  const btn=document.getElementById('btn');
  if(!silent){ btn.disabled=true; btn.textContent='Finding…'; }
  try{
    const res=await fetch(SHEETS+'?t='+Date.now(),{cache:'no-store'});
    if(!res.ok) throw new Error('Network error '+res.status);
    const data=await res.json();
    const list=Array.isArray(data.orders)?data.orders:(Array.isArray(data)?data:[]);
    allOrders=list.filter(o=>phonesMatch(o.phone, phone)).map(normalizeOrder)
      .sort((a,b)=>(Date.parse(b.updated||b.timestamp)||0)-(Date.parse(a.updated||a.timestamp)||0));
    document.getElementById('view-tabs').style.display='flex';
    if(!allOrders.length){
      document.getElementById('live-view').innerHTML=`<div class="card"><div class="empty">No orders found for <strong>${raw}</strong>.<br>Check the number and try again.</div></div>`;
      document.getElementById('history-view').innerHTML='';
    } else { renderLive(); renderHistory(); setView('live'); }
    try{ localStorage.setItem('kota_track_phone', raw); }catch(e){}
    if(!pollTimer) pollTimer=setInterval(()=>lookup(true), 8000);
  }catch(e){
    console.error(e);
    if(!silent) showErr('Could not load orders. Check internet and try again.');
  }
  if(!silent){ btn.disabled=false; btn.textContent='Find my orders'; }
}
document.getElementById('btn').addEventListener('click', ()=>lookup(false));
document.getElementById('phone').addEventListener('keydown', e=>{ if(e.key==='Enter') lookup(false); });
document.querySelectorAll('#view-tabs button').forEach(b=>{ b.addEventListener('click', ()=>setView(b.dataset.v)); });
try{ const saved=localStorage.getItem('kota_track_phone'); if(saved) document.getElementById('phone').value=saved; }catch(e){}
</script>
</body>
</html>
